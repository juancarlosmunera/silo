name: apparmor-experiment

# Temporary: can a rootless Podman container on Ubuntu be put under an AppArmor profile that root loaded?
on:
  pull_request:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: What the host has
        run: |
          podman --version; crun --version | head -1
          cat /sys/module/apparmor/parameters/enabled
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          ls -l /sys/kernel/security/apparmor/profiles || true
          sudo aa-status 2>/dev/null | head -5 || true
          podman info --format '{{.Host.Security.AppArmorEnabled}} rootless={{.Host.Security.Rootless}}'
          podman info --format '{{.Host.OCIRuntime.Path}}'

      - name: Load a test profile as root
        run: |
          sudo tee /etc/apparmor.d/silo-test >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile silo-test flags=(attach_disconnected,mediate_deleted) {
            / r,
            /** rmix,
            /tmp/** rw,
            /dev/null rw,
            network unix,
            signal (receive),
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/silo-test && echo loaded
          sudo aa-status 2>/dev/null | grep -c silo-test || true

      - name: Can an unprivileged process find out that it is loaded?
        run: |
          python3 - <<'PY'
          import os
          for name in ("silo-test", "silo-nonexistent"):
              pid = os.fork()
              if pid == 0:
                  try:
                      with open("/proc/self/attr/apparmor/exec", "w") as fh:
                          fh.write(f"exec {name}")
                      os._exit(0)
                  except OSError as exc:
                      os._exit(exc.errno or 1)
              print(name, "->", os.waitstatus_to_exitcode(os.waitpid(pid, 0)[1]))
          PY

      - name: Podman's own option, rootless
        run: |
          podman pull -q docker.io/library/python:3.13-slim
          podman run --rm --security-opt apparmor=silo-test docker.io/library/python:3.13-slim cat /proc/self/attr/current || echo "refused (exit $?)"

      - name: Through a runtime wrapper that sets the profile in the OCI config
        run: |
          REAL=$(podman info --format '{{.Host.OCIRuntime.Path}}')
          mkdir -p "$RUNNER_TEMP/oci"
          cat > "$RUNNER_TEMP/oci/silo-crun" <<WRAP
          #!/usr/bin/python3 -I
          import json, os, sys
          args = sys.argv[1:]
          bundle = None
          for i, a in enumerate(args):
              if a in ("--bundle", "-b") and i + 1 < len(args):
                  bundle = args[i + 1]
              elif a.startswith("--bundle="):
                  bundle = a.split("=", 1)[1]
          if bundle and any(a in ("create", "run") for a in args):
              path = os.path.join(bundle, "config.json")
              with open(path) as fh:
                  cfg = json.load(fh)
              cfg["process"]["apparmorProfile"] = "silo-test"
              with open(path, "w") as fh:
                  json.dump(cfg, fh)
          os.execv("$REAL", ["$REAL", *args])
          WRAP
          chmod 755 "$RUNNER_TEMP/oci/silo-crun"
          W="$RUNNER_TEMP/oci/silo-crun"
          echo "--- label inside"
          podman --runtime "$W" run --rm docker.io/library/python:3.13-slim cat /proc/self/attr/current || echo "failed (exit $?)"
          echo "--- what the profile allows and denies"
          podman --runtime "$W" run --rm docker.io/library/python:3.13-slim python3 -c '
          import socket, os
          def attempt(label, fn):
              try:
                  fn(); print(label, "-> allowed")
              except OSError as exc:
                  print(label, "->", exc.strerror)
          attempt("AF_INET socket", lambda: socket.socket(socket.AF_INET, socket.SOCK_STREAM))
          attempt("AF_UNIX socket", lambda: socket.socket(socket.AF_UNIX, socket.SOCK_STREAM))
          attempt("write /tmp/x", lambda: open("/tmp/x", "w").close())
          attempt("write /etc/x", lambda: open("/etc/x", "w").close())
          attempt("write /var/tmp/x", lambda: open("/var/tmp/x", "w").close())
          attempt("read /etc/hostname", lambda: open("/etc/hostname").read())
          attempt("chown /tmp/x (needs a capability)", lambda: os.chown("/tmp/x", 1, 1))
          ' || echo "failed (exit $?)"
          echo "--- with silo's own flags (no network, read-only, nobody, caps dropped)"
          podman --runtime "$W" run --rm --network=none --read-only --user 65534:65534 --cap-drop=all --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=64m docker.io/library/python:3.13-slim cat /proc/self/attr/current || echo "failed (exit $?)"
          echo "--- podman stop/rm through the wrapper"
          podman --runtime "$W" run -d --name w docker.io/library/python:3.13-slim sleep 60 >/dev/null && podman stop -t 1 w >/dev/null && podman rm w >/dev/null && echo "lifecycle ok"

      - name: Kernel log
        if: always()
        run: sudo dmesg 2>/dev/null | grep -i apparmor | tail -15 || true
