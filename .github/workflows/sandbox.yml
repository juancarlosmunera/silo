name: sandbox

# Runs the escape probes and a real model inside a silo, on x86_64 and aarch64 GitHub runners:
# once on the host kernel (connector, exec lock, argument allowlists, AppArmor) and once on gVisor
# (its systrap platform on both, its KVM platform on x86_64, where the runners have nested
# virtualisation). These are Ubuntu machines, so the mandatory access control tested here is
# AppArmor, through the profile in host/apparmor. SELinux is not covered.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  PROBE_IMAGE: docker.io/library/python:3.13-slim
  RUNTIME_IMAGE: ghcr.io/ggml-org/llama.cpp:server
  MODEL_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf

jobs:
  sandbox:
    name: sandbox (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      # Actions are pinned by commit, not by tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Podman, rootless
        run: |
          command -v podman >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
          grep -q "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          podman --version
          uname -m
          python3 --version

      - name: Images
        run: |
          podman pull -q "$PROBE_IMAGE"
          podman pull -q "$RUNTIME_IMAGE"

      # What root does once on an AppArmor host (host/README.md). Without it rootless Podman's
      # containers run under no mandatory access control at all.
      - name: AppArmor profile
        run: |
          cat /sys/module/apparmor/parameters/enabled
          sudo install -m 0644 host/apparmor/silo-runtime /etc/apparmor.d/silo-runtime
          sudo apparmor_parser -r /etc/apparmor.d/silo-runtime
          sudo aa-status 2>/dev/null | grep silo-runtime

      - name: Model
        run: |
          mkdir -p "$RUNNER_TEMP/models/smollm2"
          curl -sSfL -o "$RUNNER_TEMP/models/smollm2/model.gguf" "$MODEL_URL"
          for mode in errno kill; do
            cat > "$RUNNER_TEMP/silo-$mode.toml" <<TOML
          [silo]
          name = "ci-$mode"
          [model]
          dir = "$RUNNER_TEMP/models/smollm2"
          file = "model.gguf"
          ctx_size = 1024
          [runtime]
          memory = "1g"
          seccomp_action = "$mode"
          [gateway]
          port = 8088
          scanner = "enforce"
          TOML
          done

      - name: Doctor
        run: bin/silo --config "$RUNNER_TEMP/silo-errno.toml" doctor || true

      - name: Escape probes (errno)
        run: |
          bin/silo --config "$RUNNER_TEMP/silo-errno.toml" probe --json > "$RUNNER_TEMP/errno.json" || true
          python3 .github/scripts/probe_gate.py "$RUNNER_TEMP/errno.json" errno
          grep -q '"confined by AppArmor as' "$RUNNER_TEMP/errno.json"

      - name: Escape probes (kill)
        run: |
          bin/silo --config "$RUNNER_TEMP/silo-kill.toml" probe --json > "$RUNNER_TEMP/kill.json" || true
          python3 .github/scripts/probe_gate.py "$RUNNER_TEMP/kill.json" kill
          grep -q '"confined by AppArmor as' "$RUNNER_TEMP/kill.json"

      - name: Baseline (stock container, for comparison)
        run: |
          bin/silo --config "$RUNNER_TEMP/silo-errno.toml" probe --baseline -q || true

      - name: Model in a silo (kill mode)
        run: |
          cfg="$RUNNER_TEMP/silo-kill.toml"
          bin/silo --config "$cfg" intake
          bin/silo --config "$cfg" up --detach
          bin/silo --config "$cfg" gateway > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8088/health && break; sleep 1; done
          reply=$(curl -sf http://127.0.0.1:8088/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Say hello"}],"max_tokens":16}')
          echo "$reply"
          python3 -c 'import json,sys; c=json.loads(sys.argv[1])["choices"][0]["message"]["content"]; assert c.strip(), "empty"' "$reply"
          curl -sfN http://127.0.0.1:8088/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Count to three"}],"max_tokens":16,"stream":true}' | tail -n 2
          bin/silo --config "$cfg" status
          bin/silo --config "$cfg" status | grep -q '"apparmor_profile": "silo-runtime"'
          test "$(podman container inspect --format '{{.State.Running}}' silo-ci-kill)" = true
          # the runtime itself, not just the probes, runs under the profile
          sudo cat "/proc/$(podman container inspect --format '{{.State.Pid}}' silo-ci-kill)/attr/current"
          sudo cat "/proc/$(podman container inspect --format '{{.State.Pid}}' silo-ci-kill)/attr/current" | grep -q silo-runtime

      # Everything the profile refused and logged during this job. The probes provoke a few refusals on
      # purpose (a file under /proc, a look at the POSIX message queues); explicit deny rules, such as
      # the canary's, are not logged. A refusal by anything but the probes means the profile is in the
      # runtime's way.
      - name: What AppArmor denied
        if: always()
        run: |
          sudo dmesg 2>/dev/null | grep 'apparmor="DENIED"' | grep 'silo-runtime' > "$RUNNER_TEMP/denied.txt" || true
          sed -E 's/.*operation="([^"]*)".*name="([^"]*)".*comm="([^"]*)".*/\1 \2 (\3)/' "$RUNNER_TEMP/denied.txt" | sort | uniq -c
          unexpected=$(grep -vc 'comm="python3"' "$RUNNER_TEMP/denied.txt" || true)
          echo "denials by anything but the probes: $unexpected"
          test "$unexpected" = 0

      - name: Logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/gateway.log" 2>/dev/null || true
          podman logs --tail 50 silo-ci-kill 2>/dev/null || true
          grep -hE '"(FAIL|WARN)"' "$RUNNER_TEMP"/errno.json "$RUNNER_TEMP"/kill.json 2>/dev/null | head -20 || true
          sudo dmesg 2>/dev/null | grep -i 'apparmor="DENIED"' | tail -40 || true

      - name: Clean up
        if: always()
        run: bin/silo --config "$RUNNER_TEMP/silo-kill.toml" down || true

  gvisor:
    name: gVisor (${{ matrix.runner }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: systrap }
          - { runner: ubuntu-24.04-arm, platform: systrap }
          # GitHub's x86_64 runners have nested virtualisation, so gVisor's KVM platform runs there too.
          - { runner: ubuntu-24.04, platform: kvm }
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Podman, rootless
        run: |
          command -v podman >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
          grep -q "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          podman --version
          uname -m

      # gVisor's sentry runs as the sandbox's unprivileged UID, which is in no group, so /dev/kvm has to
      # be open to everyone, as it is on Fedora. On Ubuntu it belongs to root and the kvm group.
      - name: KVM for the sandbox's UID
        if: matrix.platform == 'kvm'
        run: |
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-for-all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test "$(stat -c %a /dev/kvm)" = 666

      # gVisor's own installation steps (docs/GVISOR.md): download, verify the checksum, unpack as root
      # where the sandbox's unprivileged UID can reach it and nobody but root can change it. On these
      # runners /usr/local/bin and /opt are writable by everyone, which silo refuses, so it goes below /usr/lib.
      - name: gVisor
        run: |
          set -e
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)
          cd "$RUNNER_TEMP"
          curl -fsSLO "$URL/gvisor.tar.zstd"
          curl -fsSLO "$URL/gvisor.tar.zstd.sha512"
          sha512sum -c gvisor.tar.zstd.sha512
          sudo install -d -m 0755 -o root -g root /usr/lib/gvisor
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/lib/gvisor
          sudo chown -R root:root /usr/lib/gvisor && sudo chmod -R go-w /usr/lib/gvisor
          ls -ld / /usr /usr/lib /usr/lib/gvisor /usr/lib/gvisor/runsc /usr/lib/gvisor/gvisor-bin
          /usr/lib/gvisor/runsc --version

      - name: Images
        run: |
          podman pull -q "$PROBE_IMAGE"
          podman pull -q "$RUNTIME_IMAGE"

      - name: Model
        run: |
          mkdir -p "$RUNNER_TEMP/models/smollm2"
          curl -sSfL -o "$RUNNER_TEMP/models/smollm2/model.gguf" "$MODEL_URL"
          for mode in errno kill; do
            cat > "$RUNNER_TEMP/gvisor-$mode.toml" <<TOML
          [silo]
          name = "gv-$mode"
          [model]
          dir = "$RUNNER_TEMP/models/smollm2"
          file = "model.gguf"
          ctx_size = 1024
          [runtime]
          memory = "1g"
          seccomp_action = "$mode"
          runsc = "/usr/lib/gvisor/runsc"
          gvisor_platform = "$PLATFORM"
          [gateway]
          port = 8089
          scanner = "enforce"
          TOML
          done

      - name: Doctor
        run: bin/silo --config "$RUNNER_TEMP/gvisor-errno.toml" doctor || true

      - name: Escape probes on gVisor (errno)
        run: |
          bin/silo --config "$RUNNER_TEMP/gvisor-errno.toml" probe --json > "$RUNNER_TEMP/gv-errno.json" || true
          python3 .github/scripts/probe_gate.py "$RUNNER_TEMP/gv-errno.json" errno

      - name: Escape probes on gVisor (kill)
        run: |
          bin/silo --config "$RUNNER_TEMP/gvisor-kill.toml" probe --json > "$RUNNER_TEMP/gv-kill.json" || true
          python3 .github/scripts/probe_gate.py "$RUNNER_TEMP/gv-kill.json" kill

      - name: Model on gVisor (kill mode)
        run: |
          cfg="$RUNNER_TEMP/gvisor-kill.toml"
          bin/silo --config "$cfg" intake
          bin/silo --config "$cfg" up --detach
          bin/silo --config "$cfg" gateway > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8089/health && break; sleep 1; done
          reply=$(curl -sf http://127.0.0.1:8089/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Say hello"}],"max_tokens":16}')
          echo "$reply"
          python3 -c 'import json,sys; c=json.loads(sys.argv[1])["choices"][0]["message"]["content"]; assert c.strip(), "empty"' "$reply"
          curl -sfN http://127.0.0.1:8089/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Count to three"}],"max_tokens":16,"stream":true}' | tail -n 2
          bin/silo --config "$cfg" status
          bin/silo --config "$cfg" status | grep -q "\"kernel\": \"gvisor ($PLATFORM)\""
          test "$(podman container inspect --format '{{.State.Running}}' silo-gv-kill)" = true
          # the platform asked for is the one in use: the sentry's command line, and whether it holds
          # a KVM virtual machine
          pid=$(podman container inspect --format '{{.State.Pid}}' silo-gv-kill)
          tr '\0' ' ' < "/proc/$pid/cmdline" | grep -o -- '--platform=[a-z]*'
          tr '\0' ' ' < "/proc/$pid/cmdline" | grep -q -- "--platform=$PLATFORM "
          fds=$(sudo ls -l "/proc/$pid/fd")
          vms=$(printf '%s\n' "$fds" | grep -c 'anon_inode:kvm-vm' || true)
          echo "KVM virtual machines held by the sentry: $vms"
          if [ "$PLATFORM" = kvm ]; then test "$vms" -ge 1; else test "$vms" = 0; fi

      - name: Logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/gateway.log" 2>/dev/null || true
          podman logs --tail 50 silo-gv-kill 2>/dev/null || true
          cat "$RUNNER_TEMP"/gv-*.json 2>/dev/null | head -c 4000 || true

      - name: Clean up
        if: always()
        run: bin/silo --config "$RUNNER_TEMP/gvisor-kill.toml" down || true
