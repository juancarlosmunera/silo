# silo host hardening
#
# Kernel settings that back the sandbox up from the outside. They apply to the whole machine, not
# only to silo, so read each one before enabling it. `silo doctor` shows which the host already has.
#
#   sudo install -m 0644 host/sysctl/90-silo-hardening.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# sysctl.d does not support trailing comments; keep comments on their own lines.

# ---------------------------------------------------------------------------------------------
# Low risk on a workstation.
# ---------------------------------------------------------------------------------------------

# Hide kernel pointers and the kernel log from unprivileged readers (KASLR).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1

# ptrace only one's own descendants. Side effect: `gdb -p` / `strace -p` on a process you did not
# start needs sudo.
kernel.yama.ptrace_scope = 1

# No unprivileged eBPF, perf or userfaultfd: three recurring sources of local privilege escalation.
kernel.unprivileged_bpf_disabled = 1
kernel.perf_event_paranoid = 2
vm.unprivileged_userfaultfd = 0

# Constant blinding in the BPF JIT for unprivileged users (classic BPF stays reachable through
# seccomp(2) and SO_ATTACH_FILTER, which the sandbox is still allowed to use).
net.core.bpf_jit_harden = 1

# Unprivileged users cannot trigger autoloading of TTY line-discipline modules (n_gsm, n_hdlc, ...).
# The sandbox has no pty at all; this covers the rest of the machine. Root (pppd, hciattach) is
# unaffected.
dev.tty.ldisc_autoload = 0

# ---------------------------------------------------------------------------------------------
# Can break other software. Uncomment deliberately.
# The sandbox does not depend on either: its seccomp profile already denies io_uring always and
# memfd_create whenever no GPU is passed through.
# ---------------------------------------------------------------------------------------------

# io_uring for privileged processes only (2 = nobody). Breaks unprivileged programs that require
# io_uring instead of falling back to epoll/AIO.
#kernel.io_uring_disabled = 1

# memfd_create() without an explicit MFD_EXEC yields a non-executable memfd. Breaks programs that
# map or execute anonymous memfds without asking for it (some JITs, older container runtimes).
#vm.memfd_noexec = 1
