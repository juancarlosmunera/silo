# Drop-in for a machine that is supposed to have no network device at all (docs/LOCAL_VM.md):
# the model does not start while any interface other than loopback exists, for example while the
# VM is booted with a network device to update it.
#
#   mkdir -p ~/.config/systemd/user/silo.service.d
#   cp examples/systemd/silo.service.d/no-network.conf ~/.config/systemd/user/silo.service.d/
#   systemctl --user daemon-reload

[Service]
ExecCondition=/bin/sh -c 'test "$(ls /sys/class/net | tr "\n" " ")" = "lo "'
